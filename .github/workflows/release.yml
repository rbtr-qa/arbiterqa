name: Release npm

# Publishes @rbtrqa/cli with npm trusted publishing (GitHub OIDC). There is no
# npm token anywhere: npmjs.com trusts this repo + this workflow file, and the
# publish carries a provenance attestation.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'npm publish --dry-run only'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Use npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@11
      - name: Tag matches package.json
        if: github.event_name == 'push'
        run: |
          VER="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VER}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VER}." >&2
            exit 1
          fi
      - name: Publish to npm (trusted publishing)
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
            exit 0
          fi
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER is already on the registry — skip publish."
            exit 0
          fi
          npm publish --access public
