name: Release npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'npm publish --dry-run only'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Use npm with trusted publishing support
        run: npm install -g npm@11
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Using NPM_TOKEN repository secret (first publish or fallback)."
          else
            echo "No NPM_TOKEN — using OIDC trusted publishing (configure on npmjs.com)."
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
        # Trusted publishing: npmjs.com → @rbtrqa/cli → GitHub Actions → rbtr-qa/arbiterqa / release.yml
        # First publish: add repository secret NPM_TOKEN (granular publish token for @rbtrqa), run workflow_dispatch.
